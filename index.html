
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tank Trace</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 15px;
  background: #1f2937;
}

h2 { margin: 5px; }

#stage {
  position: relative;
  width: 100%;
  height: 65vh;
  background: black;
  overflow: hidden;
  touch-action: none;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#tank {
  position: absolute;
  width: 90%;
  top: 5%;
  left: 5%;
  opacity: 0.5;
  touch-action: none;
  user-select: none;
}

.controls {
  padding: 18px;
}

.control {
  margin: 18px 0;
}

input {
  width: 85%;
  accent-color: #34d399;
}

button {
  padding: 12px 20px;
  border: 0;
  border-radius: 10px;
  background: #34d399;
  font-weight: bold;
  margin: 5px;
}

#status {
  color: #a7f3d0;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h2>🐅 TIGER TRACE</h2>
  <p>Your drawing assistant</p>
</header>

<div id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <img id="tank" src="tiger-tank.png" alt="Tiger tank drawing guide">
</div>

<div class="controls">

  <button onclick="startCamera()">START CAMERA</button>
  <button onclick="flipCamera()">FLIP CAMERA</button>

  <div class="control">
    <label>Transparency</label><br>
    <input type="range" id="opacity"
      min="0.05" max="1" step="0.01" value="0.5">
  </div>

  <div class="control">
    <label>Picture size</label><br>
    <input type="range" id="size"
      min="30" max="120" value="90">
  </div>

  <button onclick="resetTank()">RESET POSITION</button>

  <p id="status">Ready to trace!</p>

</div>

<script>
const camera = document.getElementById("camera");
const tank = document.getElementById("tank");
const status = document.getElementById("status");

let stream = null;
let facing = "environment";

async function startCamera() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera needs a secure HTTPS website.");
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing },
      audio: false
    });

    camera.srcObject = stream;
    status.textContent = "Camera started! Ready to trace.";
  } catch (error) {
    status.textContent = "Camera error: " + error.message;
  }
}

async function flipCamera() {
  facing = facing === "environment" ? "user" : "environment";
  await startCamera();
}

document.getElementById("opacity").oninput = e => {
  tank.style.opacity = e.target.value;
};

document.getElementById("size").oninput = e => {
  tank.style.width = e.target.value + "%";
};

function resetTank() {
  tank.style.width = "90%";
  tank.style.left = "5%";
  tank.style.top = "5%";
  tank.style.opacity = "0.5";

  document.getElementById("size").value = 90;
  document.getElementById("opacity").value = 0.5;
}

let dragging = false;
let lastX = 0;
let lastY = 0;

tank.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  tank.setPointerCapture(e.pointerId);
});

tank.addEventListener("pointermove", e => {
  if (!dragging) return;

  const rect = document.getElementById("stage")
    .getBoundingClientRect();

  const dx = (e.clientX - lastX) / rect.width * 100;
  const dy = (e.clientY - lastY) / rect.height * 100;

  tank.style.left = (parseFloat(tank.style.left || 5) + dx) + "%";
  tank.style.top = (parseFloat(tank.style.top || 5) + dy) + "%";

  lastX = e.clientX;
  lastY = e.clientY;
});

tank.addEventListener("pointerup", () => dragging = false);
tank.addEventListener("pointercancel", () => dragging = false);
</script>

</body>
</html>
